name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN permissions needed for Pages deployment.
permissions:
  pages: write
  id-token: write
  contents: read

# One deployment at a time; don't cancel in-flight deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate: only deploy what passes the full test suite.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: E2E smoke suite (headless Chrome)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:e2e

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
